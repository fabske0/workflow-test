name: Chalk color tets
on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

jobs:
    test-chalk-colors:
        name: Test chalk colors
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22.14.0
                cache: "pnpm"
            
            - name: Install Node.js dependencies
              run: pnpm add @actions/core @actions/github chalk

            - name: Test chalk colors
              run: pnpm run chalk-test